<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoImproveRecorder Waiting UX Prototype</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="app" class="prototype-shell" data-state="idle" data-variant="B">
      <section class="desktop" aria-label="Mock macOS desktop">
        <div class="menu-bar">
          <div class="traffic">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <strong>Notes</strong>
          <span>File</span>
          <span>Edit</span>
          <span>Format</span>
          <span>Window</span>
          <div class="menu-status" id="menuStatus">Recorder ready</div>
        </div>

        <div class="workspace">
          <aside class="sidebar">
            <div class="sidebar-title">Today</div>
            <button class="sidebar-row active">Inbox</button>
            <button class="sidebar-row">Meetings</button>
            <button class="sidebar-row">Drafts</button>
          </aside>

          <section class="document">
            <div class="document-header">
              <div>
                <p class="eyebrow">Focused text field</p>
                <h1>Reply draft</h1>
              </div>
              <div class="mode-chip" id="modeChip">Walkie talkie</div>
            </div>
            <textarea id="targetField" spellcheck="false">Hey James, I can take a look this afternoon. The main thing I want to understand is where the handoff feels slow versus where it feels uncertain.</textarea>
          </section>
        </div>

        <div class="edge edge-top"></div>
        <div class="edge edge-right"></div>
        <div class="edge edge-bottom"></div>
        <div class="edge edge-left"></div>

        <div id="variantRoot"></div>
      </section>

      <section class="control-panel" aria-label="Prototype controls">
        <div>
          <p class="panel-label">Simulation</p>
          <h2 id="stateLabel">Ready</h2>
        </div>
        <button id="recordButton" class="record-button" type="button">Hold to record</button>
        <button id="latchButton" class="secondary-button" type="button">Space: latch</button>
        <button id="cancelButton" class="secondary-button" type="button">Esc: cancel</button>
        <div class="state-readout" id="stateReadout">idle</div>
      </section>

      <section class="state-playground" aria-label="Shipped state playground">
        <div class="playground-header">
          <div>
            <p class="panel-label">Shipped states</p>
            <h2>State playground</h2>
          </div>
          <button id="playFlowButton" class="secondary-button" type="button">Play flow</button>
        </div>

        <div class="state-grid" id="stateGrid"></div>

        <div class="state-inspector" aria-label="Current state details">
          <p class="panel-label">Stage rail</p>
          <div class="rail-list" id="railList"></div>

          <p class="panel-label">Readout copy</p>
          <strong id="readoutTitle">Ready</strong>
          <span id="readoutDetail">Hold to dictate.</span>
          <span id="readoutCommand">Hold record to start.</span>
        </div>
      </section>

      <section class="tuning-panel" aria-label="Visual tuning controls">
        <div class="playground-header">
          <div>
            <p class="panel-label">Tuning</p>
            <h2>Dial kit</h2>
          </div>
          <button id="resetTuneButton" class="secondary-button" type="button">Reset</button>
        </div>

        <div class="preset-row" id="tuningPresets" aria-label="Tuning presets"></div>
        <form class="tuning-form" id="tuningForm"></form>

        <div class="tuning-actions">
          <button id="copyTuneButton" class="secondary-button" type="button">Copy values</button>
          <output id="tuningOutput" aria-live="polite">Subtle</output>
        </div>
      </section>

      <nav class="variant-switcher" aria-label="Prototype variant switcher">
        <button id="prevVariant" type="button" aria-label="Previous variant">‹</button>
        <div>
          <span id="variantKey">A</span>
          <strong id="variantName">Edge instrument</strong>
        </div>
        <button id="nextVariant" type="button" aria-label="Next variant">›</button>
      </nav>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
